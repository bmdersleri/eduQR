# eduQR — nginx site config (production, HTTPS)
#
# Replaces /etc/nginx/sites-available/default. Serves eduQR on BOTH the
# Tailscale hostname and the public IP. Fixes two bugs in the prior config:
#   1. root pointed at the project root (exposed .env/src/vendor/.git) → now /public
#   2. try_files had no front controller (app didn't route) → now index.php fallback
#
# Install:
#   sudo cp deploy/nginx-eduqr.conf /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prereqs:
#   - cert at /etc/nginx/ssl/eduqr.{crt,key}  (regenerate with IP SAN: deploy/make-cert.sh)
#   - php8.5-fpm socket at /run/php/php8.5-fpm.sock

# ── HTTP :80 → redirect to HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 79.123.193.62 haytekr640.tail20f79d.ts.net;
    return 301 https://$host$request_uri;
}

# ── HTTPS :443 — the app ─────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 79.123.193.62 haytekr640.tail20f79d.ts.net;

    # Document root is the public/ dir ONLY — never the project root.
    root /home/haytek/projects/eduQR/public;
    index index.php;

    ssl_certificate     /etc/nginx/ssl/eduqr.crt;
    ssl_certificate_key /etc/nginx/ssl/eduqr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12M;
    autoindex off;

    # Front controller: real files served directly, everything else → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        # App reads $_SERVER['HTTPS'] for secure-cookie decisions; force it on.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Deny hidden files (.env, .git, .htaccess …)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static asset caching
    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    access_log /var/log/nginx/eduqr.access.log;
    error_log  /var/log/nginx/eduqr.error.log;
}
