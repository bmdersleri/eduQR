# eduQR — Apache vhost for the local container stack [NFR-75]
# Mirrors deploy/apache.htaccess.example expectations: public/ is the only
# web-accessible directory and .htaccess rules are honoured.

ServerName localhost

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Everything outside public/ stays unreachable.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
